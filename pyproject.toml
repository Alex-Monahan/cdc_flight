[project]
name = "cdc-flight"
version = "0.1.0"
description = "Postgres -> MotherDuck CDC pipeline using Debezium (embedded engine) + dlt"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }

dependencies = [
    # Debezium embedded engine, driven from Python via JPype.
    # NOTE: pydbzengine is NOT published to PyPI any more (the jars make the sdist
    # too large), so it is installed straight from the tagged GitHub release.
    # 3.6.0.0 bundles Debezium 3.6.0.Final.
    "pydbzengine @ git+https://github.com/memiiso/pydbzengine.git@3.6.0.0",
    "dlt[duckdb,motherduck]>=1.19.0",
    # Upper bound is deliberate: MotherDuck only supports DuckDB releases it has
    # shipped an extension for (1.5.5 is rejected at connect time, 1.5.4 works).
    "duckdb>=1.4.0,<1.5.5",
    "psycopg[binary]>=3.2.0",
    # The apply path inserts through a registered Arrow table. MEASURED: 200 000
    # rows x 19 columns take 1.37 s that way and 410 s via `executemany`, and
    # against MotherDuck `executemany` costs a network round trip per row. This
    # is a hard dependency, not an optimisation.
    # Keep the runtime matched to the allocator compatibility decision in ADR A14/A66.
    "pyarrow==25.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
    "pytest-xdist>=3.6.0",
    "pytest-timeout>=2.3.0",
    "ruff>=0.8.0",
]

[project.scripts]
cdc-flight = "cdc_flight.pipeline:main"
cdc-flight-service = "cdc_flight.service:main"
cdc-datagen = "cdc_flight.datagen:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/cdc_flight"]

[tool.hatch.build.targets.sdist]
exclude = ["tests"]

[tool.hatch.metadata]
allow-direct-references = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --durations=20 --strict-markers"
markers = [
    "motherduck: test talks to MotherDuck cloud (needs `motherduck_token`); deselected by default",
    "e2e: full debezium + dlt end-to-end test",
    "slow: long fault-injection test (real SIGKILL, big loads); deselected by `make test`",
]
timeout = 600
log_cli_level = "INFO"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "SIM", "RUF"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402", "SIM112"]
# `motherduck_token` (lowercase) is the spelling the MotherDuck tooling exports.
"src/cdc_flight/config.py" = ["SIM112"]
